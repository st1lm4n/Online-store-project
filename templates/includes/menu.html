<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'post_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'product_create' %}">Создать продукт</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'category_list' %}">Категории</a>

        {% if user.is_authenticated %}
            <!-- Добавьте приветствие с email вместо username -->
            <span class="me-2">Привет, {{user.email}}!</span>
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-primary">Выйти</button>
            </form>
        {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'login' %}">Войти</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
