{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">
        {% if object %}Редактирование продукта{% else %}Создание продукта{% endif %}
    </h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
            <div class="col-12">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-block btn-outline-primary m-1">
                {% if object %}Сохранить{% else %}Создать{% endif %}
            </button>
            <a href="{% url 'home' %}" class="btn btn-block btn-outline-secondary m-1">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
