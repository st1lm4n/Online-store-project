{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">{{ object.title }}</h1>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-8">
            <div class="card mb-4 box-shadow">
                {% if object.preview %}
                <img src="{{ object.preview.url }}" class="card-img-top" alt="{{ object.title }}">
                {% endif %}
                <div class="card-body">
                    <p class="lead">{{ object.content }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">Опубликовано: {{ object.created_at|date:"d.m.Y H:i" }}</small>
                        <small class="text-muted">Просмотров: {{ object.views_count }}</small>
                    </div>
                    <div class="mt-4">
                        <a href="{% url 'post_list' %}" class="btn btn-lg btn-block btn-outline-primary">Назад к списку</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
