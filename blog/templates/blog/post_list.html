{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h1>Список статей</h1>
    <a href="{% url 'post_create' %}" class="btn btn-primary mb-3">Создать статью</a>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4 mb-4">
            <div class="card">
                {% if post.preview %}
                    <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                    <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Читать</a>
                    <a href="{% url 'post_update' post.pk %}" class="btn btn-warning">Редактировать</a>
                    <a href="{% url 'post_delete' post.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
